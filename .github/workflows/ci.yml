# Lint, types, every test, then a build with no settings at all: the site a
# fresh fork deploys. No secrets are used or needed; nothing here talks to
# Notion, an email platform or a shop.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # a build with Notion connected fills the snapshots; this one must not
      - run: git diff --exit-code lib/snapshot.json lib/snapshot-bodies.json
